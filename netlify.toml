# Netlify configuration — Home Organizers Long Island
# The site is plain static HTML, so there is no build command; Netlify just
# publishes the repo root as-is.

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Canonical host: keep all authority on the apex domain the canonicals point at.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://www.homeorganizersli.com/*"
  to = "https://homeorganizersli.com/:splat"
  status = 301
  force = true

# Internal working notes live in the repo but must not be served.
[[redirects]]
  from = "/keywords.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ---------------------------------------------------------------------------
# Caching. Images and fonts are content-addressed by name and effectively never
# change, so they can be cached hard. HTML must stay fresh so edits go live.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# styles.css / script.js / analytics.js have no cache-busting hashes, so they
# get a short TTL plus revalidation rather than a long immutable one.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
